overview: "Anime openings and endings on Jellyfin."
description: >
  Downloads anime openings and endings from animethemes.moe and puts them on Jellyfin's series,
  season and movie pages. Later seasons get their own themes through AniList sequels, files are
  named after the song, and a page in the dashboard shows and controls every match.
category: "Metadata"
owner: "iCosiSenpai"
artifacts:
  - "Jellyfin.Plugin.KometaThemes.dll"
  - "YoutubeExplode.dll"
changelog: |-
  v2.1.0.0
  - Fix: anime matched by title or by hand got their entry without a single theme (an API filter that also emptied the included themes). Title matching never worked in 2.0, and a manual match removed the files instead of downloading them.
  - Title matching knows every title of an entry (synonyms and abbreviations such as "DanMachi"), folds romanizations (Jouzu/Jozu), reads the folder name and its year, and tells movies from series and remakes from originals.
  - Seasons are matched to the entries animethemes.moe groups with the series, by premiere date, episodes, a season number in the name and their order. Works without AniList (its API was switched off on 2026-10-21), across movies and OVAs between seasons, for split cours in one season and for long entries split into several seasons, each with the themes of its own episodes.
  - AniList is optional: sequels are followed through every format, and requests stop for an hour when AniList refuses them.
  - Openings and endings are capped separately: long series keep their endings.
  - Versions that only fade into the episode are used when no clean one exists; videos with burned-in subtitles or lyrics are avoided.
  - Jellyfin registers new themes with a validation refresh: no metadata provider is queried.
  - Anime page: a Seasons list shows how every season plays its themes; Change match lists the entries of the same franchise first; the poster list is no longer stretched.
  - Removed: aniSearch IDs (animethemes.moe does not store them) and leftover 1.x code.
