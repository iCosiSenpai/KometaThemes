changelog: |-
  v2.0.0.0
  - Jellyfin 12 only: rebuilt for .NET 10 and the Jellyfin 12 API. 1.x crashed on Jellyfin 12 after every download.
  - New interface written from scratch: library, anime page with an episode map, activity, settings, first-run setup, ♪ button on item pages.
  - Each season gets its own themes through AniList sequels, accepted only when year and episodes agree. 1.x handed a show's later endings to later seasons.
  - Files are named after the song and tagged; 1.x files are renamed, not downloaded again.
  - Removes the duplicate theme.mp3 copies 1.x made, only when identical to a song it downloaded.
  - Registers new themes with a light refresh instead of re-downloading all metadata of the series.
  - Fixes: manual matches ignored by the scheduled sync, one network error stopping a whole sync, unresolved anime retried on every sync, several entries for one ID deleting each other's files, concurrent writes to the same file, Theme Finder downloads not tracked, anonymous endpoint echoing HTML.
  - Removed: .m3u playlist, dry run, presets, raw log viewer, library name pattern (libraries are picked by name now).
