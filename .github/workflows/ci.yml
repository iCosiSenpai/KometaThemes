name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Jellyfin ${{ matrix.jellyfin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.0.0', '12.1.0', '12.2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: ffmpeg for the installer tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Versions agree
        run: python3 tools/check_versions.py
      - name: Build
        run: dotnet build -c Release -p:JellyfinVersion=${{ matrix.jellyfin }}
      - name: Test
        run: dotnet test --no-build -c Release -p:JellyfinVersion=${{ matrix.jellyfin }} --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.jellyfin }}
          path: '**/TestResults/*.trx'

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  package:
    name: Package
    needs: [backend, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Always against the oldest supported server, so one DLL loads on every Jellyfin 12.x.
      - name: Build against Jellyfin 12.0.0
        run: dotnet build Jellyfin.Plugin.KometaThemes/Jellyfin.Plugin.KometaThemes.csproj -c Release -p:JellyfinVersion=12.0.0
      - name: Zip
        run: |
          out=Jellyfin.Plugin.KometaThemes/bin/Release/net10.0
          mkdir -p artifacts
          python3 tools/release_meta.py artifacts/meta.json
          # An explicit list: never ship server assemblies next to the plugin.
          zip -j artifacts/KometaThemes.zip "$out/Jellyfin.Plugin.KometaThemes.dll" "$out/YoutubeExplode.dll" artifacts/meta.json
          unzip -l artifacts/KometaThemes.zip
          actual=$(unzip -Z1 artifacts/KometaThemes.zip | sort | tr '\n' ' ')
          expected="Jellyfin.Plugin.KometaThemes.dll YoutubeExplode.dll meta.json "
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected package contents: $actual"
            exit 1
          fi
          md5sum artifacts/KometaThemes.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KometaThemes-plugin
          path: artifacts/KometaThemes.zip
